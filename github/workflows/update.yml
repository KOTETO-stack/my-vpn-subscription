name: Update VPN

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install aiohttp
      - run: python scripts/fetch_configs.py
      - run: |
          git config user.name "Bot"
          git config user.email "bot@github.com"
          git add configs.txt info.json
          git diff --cached --quiet || git commit -m "update $(date +'%H:%M')"
          git push
