name: Update VPN

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: pip install aiohttp
      
      - run: python scripts/fetch_configs.py
      
      - name: Upload configs
        uses: actions/upload-artifact@v4
        with:
          name: vpn-configs
          path: |
            configs.txt
            info.json
          retention-days: 90

